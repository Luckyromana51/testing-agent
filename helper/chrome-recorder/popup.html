<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GLV Step Recorder</title>
<style>
  body { font: 13px system-ui, sans-serif; width: 360px; margin: 12px; color: #1f2933; }
  h1 { font-size: 15px; margin: 0 0 6px; }
  p { margin: 4px 0 8px; color: #52606d; }
  .row { display: flex; gap: 6px; margin: 8px 0; }
  button { flex: 1; padding: 7px; border: 1px solid #cbd2d9; border-radius: 6px; background: #fff; cursor: pointer; font: inherit; }
  button.main { background: #2f6fde; color: #fff; border-color: #2f6fde; }
  button.stop { background: #c62828; color: #fff; border-color: #c62828; }
  textarea { width: 100%; box-sizing: border-box; height: 220px; font: 12px ui-monospace, monospace; border: 1px solid #cbd2d9; border-radius: 6px; padding: 6px; }
  .state { font-weight: 600; }
</style>
</head>
<body>
  <h1>GLV Step Recorder</h1>
  <p>Press Record, use the client's app, then Copy and paste the steps into a journey on the project page. Alt+click a text to add a "see" check. Passwords are saved as {{password}}.</p>
  <p class="state" id="state">Not recording</p>
  <div class="row">
    <button id="rec" class="main">Record</button>
    <button id="clear">Clear</button>
    <button id="copy">Copy</button>
  </div>
  <textarea id="steps" spellcheck="false" aria-label="Recorded steps"></textarea>
  <script src="popup.js"></script>
</body>
</html>

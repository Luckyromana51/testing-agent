# GLV rules for JavaScript and TypeScript. Written by GLV Infotech for the testing platform.
# Each rule names the risk and the safe way to write it. metadata.glv-same-as is the platform's
# own check for the same problem, so one problem found twice is reported once.
rules:
  - id: glv.js.sql-injection
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      SQL query built from request data (SQL injection). Pass the values as parameters
      (? or $1) instead of joining them into the SQL text.
    metadata:
      glv-same-as: "code:sql-injection"
      glv-title: "SQL query built from request data (SQL injection)"
      cwe: "CWE-89"
    pattern-sources: &js-request
      - pattern: $REQ.query
      - pattern: $REQ.body
      - pattern: $REQ.params
      - pattern: $REQ.headers
      - pattern: $REQ.cookies
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $DB.query($SQL, ...)
              - pattern: $DB.execute($SQL, ...)
              - pattern: $DB.raw($SQL, ...)
              - pattern: $DB.$queryRawUnsafe($SQL, ...)
              - pattern: $DB.$executeRawUnsafe($SQL, ...)
          - focus-metavariable: $SQL
    pattern-sanitizers:
      - pattern: parseInt(...)
      - pattern: Number(...)

  - id: glv.js.command-injection
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Shell command built from request data (command injection). Use execFile or spawn with
      an argument list and no shell, and check the value against a list of allowed values.
    metadata:
      glv-same-as: "code:command-injection"
      glv-title: "Shell command built from request data (command injection)"
      cwe: "CWE-78"
    pattern-sources: *js-request
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: exec($CMD, ...)
              - pattern: execSync($CMD, ...)
              - pattern: $CP.exec($CMD, ...)
              - pattern: $CP.execSync($CMD, ...)
              - pattern: "spawn($CMD, $ARGS, {..., shell: true, ...})"
              - pattern: "$CP.spawn($CMD, $ARGS, {..., shell: true, ...})"
          - focus-metavariable: $CMD

  - id: glv.js.eval-input
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Request data is run as code. Never pass input to eval, new Function or vm; parse it
      as data (JSON.parse) instead.
    metadata:
      glv-same-as: "code:eval"
      glv-title: "Request data is run as code"
      cwe: "CWE-95"
    pattern-sources: *js-request
    pattern-sinks:
      - pattern: eval(...)
      - pattern: new Function(...)
      - pattern: $VM.runInNewContext(...)
      - pattern: $VM.runInThisContext(...)

  - id: glv.js.ssrf
    mode: taint
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      The server fetches an address that comes from the request (server-side request forgery).
      An attacker can make it call internal services. Allow only known hosts.
    metadata:
      glv-same-as: "code:ssrf"
      glv-title: "Server fetches an address from the request (SSRF)"
      cwe: "CWE-918"
    pattern-sources: *js-request
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: fetch($URL, ...)
              - pattern: axios($URL, ...)
              - pattern: axios.$M($URL, ...)
              - pattern: got($URL, ...)
              - pattern: $HTTP.get($URL, ...)
              - pattern: $HTTP.request($URL, ...)
          - focus-metavariable: $URL

  - id: glv.js.open-redirect
    mode: taint
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Redirects to an address taken from the request (open redirect), which phishing links
      use. Redirect only to your own paths or a list of allowed addresses.
    metadata:
      glv-same-as: "code:open-redirect"
      glv-title: "Redirect to an address from the request (open redirect)"
      cwe: "CWE-601"
    pattern-sources: *js-request
    pattern-sinks:
      - pattern: $RES.redirect(...)

  - id: glv.js.path-traversal
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A file path comes from the request (path traversal): "../" can read any file on the
      server. Use path.basename, or res.sendFile with the root option.
    metadata:
      glv-title: "File path from the request (path traversal)"
      cwe: "CWE-22"
    pattern-sources: *js-request
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $FS.readFile($P, ...)
              - pattern: $FS.readFileSync($P, ...)
              - pattern: $FS.createReadStream($P, ...)
              - pattern: $FS.writeFile($P, ...)
              - pattern: $FS.unlink($P, ...)
              - patterns:
                  - pattern: $RES.sendFile($P)
          - focus-metavariable: $P
    pattern-sanitizers:
      - pattern: path.basename(...)

  - id: glv.js.dom-xss
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Text from the address bar is written into the page as HTML (cross-site scripting).
      Use textContent, or clean the HTML with DOMPurify first.
    metadata:
      glv-same-as: "code:xss"
      glv-title: "Address bar text written into the page as HTML (XSS)"
      cwe: "CWE-79"
    pattern-sources:
      - pattern: location.hash
      - pattern: location.search
      - pattern: location.href
      - pattern: window.location.hash
      - pattern: window.location.search
      - pattern: document.URL
      - pattern: document.referrer
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $EL.innerHTML = $X
              - pattern: $EL.outerHTML = $X
              - pattern: document.write($X)
              - pattern: $EL.insertAdjacentHTML($POS, $X)
          - focus-metavariable: $X
    pattern-sanitizers:
      - pattern: DOMPurify.sanitize(...)
      - pattern: encodeURIComponent(...)

  - id: glv.js.react-raw-html
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      HTML is put into the page without cleaning (dangerouslySetInnerHTML). If any of it comes
      from users, clean it with DOMPurify.sanitize first.
    metadata:
      glv-same-as: "code:xss"
      glv-title: "HTML put into a React page without cleaning"
      cwe: "CWE-79"
    patterns:
      - pattern: "<$EL dangerouslySetInnerHTML={{__html: $X}} />"
      - pattern-not: "<$EL dangerouslySetInnerHTML={{__html: \"...\"}} />"
      - pattern-not: "<$EL dangerouslySetInnerHTML={{__html: DOMPurify.sanitize(...)}} />"

  - id: glv.js.tls-verify-off
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Certificate checks are turned off, so anyone on the network can read and change the
      traffic. Remove rejectUnauthorized: false (or NODE_TLS_REJECT_UNAUTHORIZED=0).
    metadata:
      glv-same-as: "code:tls-verify-off"
      glv-title: "Certificate checks turned off"
      cwe: "CWE-295"
    pattern-either:
      - pattern: "{..., rejectUnauthorized: false, ...}"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
      - pattern: process.env["NODE_TLS_REJECT_UNAUTHORIZED"] = "0"

  - id: glv.js.hardcoded-jwt-secret
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Login tokens are signed with a password written in the code. Anyone with the code can
      make tokens for any user. Read the secret from the environment and change it.
    metadata:
      glv-same-as: "code:hardcoded-crypto-key"
      glv-title: "Login tokens signed with a secret written in the code"
      cwe: "CWE-798"
    pattern-either:
      - pattern: $JWT.sign($P, "...", ...)
      - pattern: $JWT.verify($T, "...", ...)

  - id: glv.js.cors-any-origin-credentials
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Any website may call this server with the visitor's cookies (CORS reflects every origin
      with credentials). List the allowed origins instead.
    metadata:
      glv-title: "Any website may call the server with the visitor's cookies (CORS)"
      cwe: "CWE-942"
    pattern-either:
      - pattern: "cors({..., origin: true, ..., credentials: true, ...})"
      - pattern: "cors({..., credentials: true, ..., origin: true, ...})"
      - pattern: $RES.setHeader("Access-Control-Allow-Origin", $REQ.headers.origin)
      - pattern: $RES.header("Access-Control-Allow-Origin", $REQ.headers.origin)

  - id: glv.js.weak-password-hash
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Passwords are hashed with MD5 or SHA-1, which can be cracked in seconds. Use bcrypt,
      scrypt or argon2.
    metadata:
      glv-same-as: "code:weak-password-hash"
      glv-title: "Passwords hashed with MD5 or SHA-1"
      cwe: "CWE-916"
    patterns:
      - pattern: $C.createHash($ALG).update($PW)
      - metavariable-regex:
          metavariable: $ALG
          regex: "^['\"](md5|sha1)['\"]$"
      - metavariable-regex:
          metavariable: $PW
          regex: "(?i).*pass.*"

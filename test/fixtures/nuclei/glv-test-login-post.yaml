id: glv-test-login-post
info:
  name: Default login works (GLV test template)
  author: glv
  severity: critical
  tags: login,glv-test
http:
  - method: POST
    path:
      - "{{BaseURL}}/login"
    body: "user=admin&pass=admin"
    matchers:
      - type: status
        status:
          - 200
          - 404

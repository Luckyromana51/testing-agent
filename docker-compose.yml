services:
  testing-agent:
    build: .
    image: glv/testing-agent:latest
    # Intel (amd64) by default: native on most servers, and runs on Apple Silicon Macs
    # through Docker Desktop's Rosetta emulation. On an ARM Linux server, set
    # DOCKER_PLATFORM=linux/arm64 in .env to build the native ARM image instead.
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    restart: unless-stopped
    # A tiny init process forwards docker stop to the app and cleans up finished browser processes.
    init: true
    stop_grace_period: 20s
    ports:
      - "4000:4000"
    env_file: .env
    # These win over .env: inside the container the app must listen on 4000 and store
    # data in the /data volume (it runs as a non-root user and cannot write elsewhere).
    environment:
      PORT: "4000"
      DATA_DIR: /data
      # Login is OFF by default while GLV builds and tests the system on its own computers:
      # no owner account and no sign-in. Before putting it on a server, add AUTH_DISABLED=0
      # to .env and restart (docker compose up -d). See "Login switch" in README.md.
      AUTH_DISABLED: ${AUTH_DISABLED:-1}
      # OWASP ZAP runs in its own container (below); only this app can reach it.
      ZAP_URL: http://zap:8080
      ZAP_API_KEY: ${ZAP_API_KEY:-glv-local-zap}
      # Optional modules in their own containers (see the profiles below). Each one is used only
      # when its address is set: add the line to .env after starting its profile.
      MAILPIT_URL: ${MAILPIT_URL:-}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-}
      K6_INFLUX_URL: ${K6_INFLUX_URL:-}
      GRAFANA_URL: ${GRAFANA_URL:-}
      # Test phones. With the android profile: ANDROID_DEVICE=android:5555 and
      # APP_SERVER_ADDRESS=http://testing-agent:4000 in .env (Appium then starts inside this container).
      ANDROID_DEVICE: ${ANDROID_DEVICE:-}
      APPIUM_URL: ${APPIUM_URL:-}
      APP_SERVER_ADDRESS: ${APP_SERVER_ADDRESS:-}
      APP_PROXY_PORT: ${APP_PROXY_PORT:-8899}
      # Wave 1 modules (each used only when set; see "Wave 1 modules" in README.md):
      # GLV's public address for blind-hole callbacks, or an Interactsh server.
      OOB_BASE_URL: ${OOB_BASE_URL:-}
      INTERACTSH_SERVER: ${INTERACTSH_SERVER:-}
      INTERACTSH_TOKEN: ${INTERACTSH_TOKEN:-}
      # Browser version matrix (profile grid): SELENIUM_GRID_URL=http://selenium-hub:4444
      SELENIUM_GRID_URL: ${SELENIUM_GRID_URL:-}
      # Mobile security (profile mobsf): MOBSF_URL=http://mobsf:8000 and the key from MobSF's API page.
      MOBSF_URL: ${MOBSF_URL:-}
      MOBSF_API_KEY: ${MOBSF_API_KEY:-}
      # Phone farm (profile farm): STF_URL=http://stf:7100 and an access token from STF's Settings > Keys.
      STF_URL: ${STF_URL:-}
      STF_TOKEN: ${STF_TOKEN:-}
      DNS_SERVER: ${DNS_SERVER:-}
    depends_on:
      zap:
        condition: service_healthy
    volumes:
      - agent-data:/data
    # Chromium needs more shared memory than Docker's 64 MB default.
    shm_size: "1gb"

  # OWASP ZAP for the "ZAP (passive)" and "ZAP (active)" tool tabs. The app only asks it to look at
  # pages the test already opened (GET requests) and never starts a spider. An active (attack) scan
  # runs only for a project with the client's written permission, on those pages, GET only.
  # No ports are published, so nothing outside this compose network can use it.
  zap:
    image: zaproxy/zap-stable:2.17.0
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    restart: unless-stopped
    command: >-
      zap.sh -daemon -host 0.0.0.0 -port 8080 -silent
      -config api.key=${ZAP_API_KEY:-glv-local-zap}
      -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true

  # Optional: "Test mailbox (Mailpit)". Start with: docker compose --profile mail up -d
  # then add MAILPIT_URL=http://mailpit:8025 to .env and restart the app. Point the staging site's
  # SMTP at this server, port 1025. The mailbox screen is on port 8025.
  mailpit:
    image: axllent/mailpit:v1.33.1
    profiles: ["mail"]
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "5000"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "1025:1025"
      - "8025:8025"

  # Optional: "Live load charts". Start with: docker compose --profile loadcharts up -d
  # then add K6_INFLUX_URL=http://influxdb:8086 and GRAFANA_URL=http://localhost:3000 to .env and
  # restart the app. Grafana (port 3000) opens the k6 dashboard without a login, read-only.
  influxdb:
    image: influxdb:1.8
    profiles: ["loadcharts"]
    restart: unless-stopped
    environment:
      INFLUXDB_DB: k6
      INFLUXDB_HTTP_FLUX_ENABLED: "false"
    volumes:
      - influx-data:/var/lib/influxdb

  grafana:
    image: grafana/grafana-oss:13.0.1
    profiles: ["loadcharts"]
    restart: unless-stopped
    depends_on: [influxdb]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  # Optional: "Test phones", the built-in Android emulator (Android 14). Start with:
  #   docker compose --profile android up -d
  # then add ANDROID_DEVICE=android:5555 and APP_SERVER_ADDRESS=http://testing-agent:4000 to .env and
  # run docker compose up -d again. It needs hardware virtualisation (/dev/kvm): a Linux server, or
  # Windows with WSL 2. The phone's screen can be watched in a browser on port 6080.
  android:
    image: budtmo/docker-android:emulator_14.0_v3.9.0-p2
    profiles: ["android"]
    platform: linux/amd64
    restart: unless-stopped
    devices:
      - /dev/kvm
    environment:
      EMULATOR_DEVICE: "Samsung Galaxy S10"
      WEB_VNC: "true"
    ports:
      - "6080:6080"
    volumes:
      - android-data:/home/androidusr

  # Optional: "Browser version matrix". Start with: docker compose --profile grid up -d
  # then add SELENIUM_GRID_URL=http://selenium-hub:4444 to .env and restart the app. Each node is one
  # older browser version real visitors still use. No ports are published.
  selenium-hub:
    image: selenium/hub:4.27.0
    profiles: ["grid"]
    restart: unless-stopped
  chrome-109:
    image: selenium/node-chrome:109.0
    profiles: ["grid"]
    restart: unless-stopped
    shm_size: "1gb"
    depends_on: [selenium-hub]
    environment: &node
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: "4442"
      SE_EVENT_BUS_SUBSCRIBE_PORT: "4443"
  chrome-120:
    image: selenium/node-chrome:120.0
    profiles: ["grid"]
    restart: unless-stopped
    shm_size: "1gb"
    depends_on: [selenium-hub]
    environment: *node
  firefox-115:
    image: selenium/node-firefox:115.0
    profiles: ["grid"]
    restart: unless-stopped
    shm_size: "1gb"
    depends_on: [selenium-hub]
    environment: *node
  edge-120:
    image: selenium/node-edge:120.0
    profiles: ["grid"]
    restart: unless-stopped
    shm_size: "1gb"
    depends_on: [selenium-hub]
    environment: *node

  # Optional: "Mobile security (MobSF)". Start with: docker compose --profile mobsf up -d
  # then add MOBSF_URL=http://mobsf:8000 and MOBSF_API_KEY (MobSF screen, port 8000 > API docs) to .env.
  mobsf:
    image: opensecurity/mobile-security-framework-mobsf:v4.4.3
    profiles: ["mobsf"]
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - mobsf-data:/home/mobsf/.MobSF

  # Optional: GLV's own Interactsh server for blind holes. It needs a domain whose name servers point
  # at this server (see README). Start with: docker compose --profile oob up -d, then set
  # INTERACTSH_SERVER=https://oob.example.com and INTERACTSH_TOKEN in .env.
  interactsh:
    image: projectdiscovery/interactsh-server:v1.2.4
    profiles: ["oob"]
    restart: unless-stopped
    command: -domain ${OOB_DOMAIN:-oob.example.com} -token ${INTERACTSH_TOKEN:-change-me} -skip-acme
    ports:
      - "53:53/udp"
      - "8085:80"

  # Optional: "Phone farm" (DeviceFarmer / STF) on the machine the Android phones are plugged into.
  # Start with: docker compose --profile farm up -d, open port 7100, create a token in Settings > Keys,
  # then add STF_URL and STF_TOKEN to .env. The phones' USB is shared through adb on the host.
  rethinkdb:
    image: rethinkdb:2.4.4
    profiles: ["farm"]
    restart: unless-stopped
    command: rethinkdb --bind all --cache-size 2048
    volumes:
      - farm-db:/data
  adbd:
    image: devicefarmer/adb:latest
    profiles: ["farm"]
    restart: unless-stopped
    privileged: true
    volumes:
      - /dev/bus/usb:/dev/bus/usb
  stf:
    image: devicefarmer/stf:3.7.4
    profiles: ["farm"]
    restart: unless-stopped
    depends_on: [rethinkdb, adbd]
    environment:
      RETHINKDB_PORT_28015_TCP: tcp://rethinkdb:28015
    command: stf local --adb-host adbd --public-ip ${FARM_PUBLIC_IP:-127.0.0.1} --provider-min-port 7400 --provider-max-port 7700 --allow-remote
    ports:
      - "7100:7100"
      - "7400-7700:7400-7700"

volumes:
  farm-db:
  mobsf-data:
  agent-data:
  android-data:
  influx-data:
